<!-- Component: NotebookCover (Physical Academic Binder Front Cover) -->
<header class="nb-cover" id="{{COVER_ID}}">
  <div class="nb-cover__brand">BRAIN HUB · NOTEBOOK OS — PAPER EDITION</div>
  <div class="nb-stamps">
    <span class="nb-stamp nb-stamp--blue">{{ARCHETYPE_STAMP}}</span>
    <span class="nb-stamp nb-stamp--green">{{SUBJECT_STAMP}}</span>
    <span class="nb-stamp nb-stamp--amber">{{TIER_STAMP}}</span>
  </div>
  <h1 class="nb-hand-underline nb-cover__title">{{NOTEBOOK_TITLE}}</h1>
  <div class="nb-cover__meta">{{SUBJECT}} · {{ACADEMIC_TIER}} · {{CURRICULUM_REF}}</div>
  <div class="nb-cover__motto">"{{STUDENT_MOTTO}}"</div>
</header>
