<!-- Component: Definition (Formal Technical Term with Rubber Stamp Badge) -->
<div class="nb-definition" id="{{DEF_ID}}">
  <div class="nb-definition__header">
    <dt class="nb-definition__term">{{TERM_NAME}}</dt>
    <span class="nb-stamp nb-stamp--amber">{{ACRONYM_LABEL}}</span>
  </div>
  <dd class="nb-definition__body">
    {{DEFINITION_TEXT}}
  </dd>
  <div class="nb-definition__context">
    <strong>Strategic Context:</strong> {{STRATEGIC_CONTEXT}}
  </div>
</div>
