<!-- Component: KeyConcept (Seminal Axiom with Wavy Underline & Student Marginalia) -->
<article class="nb-key-concept" id="{{CONCEPT_ID}}">
  <div class="nb-key-concept__num">{{CONCEPT_NUM_LABEL}}</div>
  <h3 class="nb-key-concept__title nb-hand-underline">{{CONCEPT_NAME}}</h3>
  <div class="nb-key-concept__body">
    {{CONCEPT_BODY_HTML}}
  </div>
  <div class="nb-key-concept__annotation">
    ✏️ <em>Student Note: {{MARGINALIA_NOTE}}</em>
  </div>
</article>
