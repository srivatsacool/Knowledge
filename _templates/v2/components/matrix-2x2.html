<!-- Component: 2x2 Strategic Matrix -->
<div class="nb-matrix-2x2" id="{{MATRIX_ID}}" role="region" aria-label="{{MATRIX_LABEL}}">
  <div class="nb-matrix-2x2__y-axis">{{Y_AXIS_LABEL}} ↑</div>
  <div class="nb-matrix-2x2__grid">
    <div class="nb-matrix-2x2__quadrant nb-matrix-2x2__quadrant--top-left">
      <div class="nb-matrix-2x2__q-label">{{TL_LABEL}}</div>
      <h4 class="nb-matrix-2x2__q-title">{{TL_TITLE}}</h4>
      <p>{{TL_DESC}}</p>
    </div>
    <div class="nb-matrix-2x2__quadrant nb-matrix-2x2__quadrant--top-right is-star">
      <div class="nb-matrix-2x2__q-label">{{TR_LABEL}}</div>
      <h4 class="nb-matrix-2x2__q-title">{{TR_TITLE}}</h4>
      <p>{{TR_DESC}}</p>
    </div>
    <div class="nb-matrix-2x2__quadrant nb-matrix-2x2__quadrant--bottom-left is-danger">
      <div class="nb-matrix-2x2__q-label">{{BL_LABEL}}</div>
      <h4 class="nb-matrix-2x2__q-title">{{BL_TITLE}}</h4>
      <p>{{BL_DESC}}</p>
    </div>
    <div class="nb-matrix-2x2__quadrant nb-matrix-2x2__quadrant--bottom-right">
      <div class="nb-matrix-2x2__q-label">{{BR_LABEL}}</div>
      <h4 class="nb-matrix-2x2__q-title">{{BR_TITLE}}</h4>
      <p>{{BR_DESC}}</p>
    </div>
  </div>
  <div class="nb-matrix-2x2__x-axis">{{X_AXIS_LABEL}} →</div>
</div>
