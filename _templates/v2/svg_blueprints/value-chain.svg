<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <!-- Outer Box Container for Activities -->
  <path d="M 30 30 L 740 30 L 850 200 L 740 370 L 30 370 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Right Margin Triangle Wedge -->
  <path d="M 740 30 L 850 200 L 740 370 Z" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="2.2"/>
  <text x="775" y="195" text-anchor="middle" font-family="var(--font-hand)" font-size="24" font-weight="700" fill="var(--red)" transform="rotate(90, 775, 195)">MARGIN</text>

  <!-- Support Activities (Stacked Top Section) -->
  <rect x="30" y="30" width="710" height="38" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="45" y="55" font-family="var(--font-hand2)" font-size="14" font-weight="700" fill="var(--pencil)">FIRM INFRASTRUCTURE (ERP Finance, Legal, Executive Controls)</text>

  <rect x="30" y="68" width="710" height="38" fill="var(--paper)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="45" y="93" font-family="var(--font-hand2)" font-size="14" font-weight="700" fill="var(--pencil)">HUMAN RESOURCE MANAGEMENT (Payroll, Talent, Succession, Performance)</text>

  <rect x="30" y="106" width="710" height="38" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="45" y="131" font-family="var(--font-hand2)" font-size="14" font-weight="700" fill="var(--pencil)">TECHNOLOGY DEVELOPMENT (Clean Core ERP Architecture, APIs, AI Automation)</text>

  <rect x="30" y="144" width="710" height="38" fill="var(--paper)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="45" y="169" font-family="var(--font-hand2)" font-size="14" font-weight="700" fill="var(--pencil)">PROCUREMENT (Strategic Sourcing, Supplier Scorecards, Contract Lifecycle)</text>

  <!-- Horizontal Divider Line separating Support and Primary -->
  <path d="M 30 182 L 740 182" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Primary Activities (Vertical Columns Across Bottom) -->
  <!-- Col 1: Inbound Logistics -->
  <rect x="30" y="182" width="142" height="188" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="101" y="215" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--ink)">Inbound Logistics</text>
  <text x="101" y="245" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Goods Receipt</text>
  <text x="101" y="265" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Put-away Routing</text>
  <text x="101" y="285" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Lot Control</text>

  <!-- Col 2: Operations -->
  <rect x="172" y="182" width="142" height="188" fill="var(--sticky-g)" stroke="var(--green)" stroke-width="1.4"/>
  <text x="243" y="215" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--green)">Operations</text>
  <text x="243" y="245" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• MRP Explosion</text>
  <text x="243" y="265" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Shop Floor Orders</text>
  <text x="243" y="285" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Work Centers</text>

  <!-- Col 3: Outbound Logistics -->
  <rect x="314" y="182" width="142" height="188" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="385" y="215" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--ink)">Outbound Logistics</text>
  <text x="385" y="245" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Picking & Packing</text>
  <text x="385" y="265" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Carrier Booking</text>
  <text x="385" y="285" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Proof of Delivery</text>

  <!-- Col 4: Marketing & Sales -->
  <rect x="456" y="182" width="142" height="188" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="527" y="215" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--ink)">Marketing & Sales</text>
  <text x="527" y="245" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Pricing Engine</text>
  <text x="527" y="265" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Sales Orders</text>
  <text x="527" y="285" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Credit Checks</text>

  <!-- Col 5: Service -->
  <rect x="598" y="182" width="142" height="188" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
  <text x="669" y="215" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--ink)">Service</text>
  <text x="669" y="245" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Warranty Claims</text>
  <text x="669" y="265" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Field Dispatch</text>
  <text x="669" y="285" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">• Customer Return</text>
</svg>
