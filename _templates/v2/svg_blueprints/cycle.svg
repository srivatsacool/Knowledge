<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="cyc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Center Circle: Core Mandate -->
  <circle cx="430" cy="230" r="75" fill="var(--sticky-y)" stroke="var(--ink)" stroke-width="2.5"/>
  <text x="430" y="222" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--red)">CONTINUOUS</text>
  <text x="430" y="244" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">PDCA Loop</text>
  <text x="430" y="262" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">ERP Closed Loop</text>

  <!-- Quadrant 1: Top-Right (PLAN) -->
  <path d="M 470 50 Q 640 45 680 130 Q 640 160 480 145" fill="none" stroke="var(--ink2)" stroke-width="2.8" stroke-dasharray="4 2"/>
  <rect x="520" y="40" width="220" height="75" rx="8" fill="var(--card)" stroke="var(--ink2)" stroke-width="2"/>
  <text x="630" y="68" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink2)">1. PLAN (S&OP / MPS)</text>
  <text x="630" y="92" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Forecast demand, aggregate plan,</text>
  <text x="630" y="107" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">and run MRP net requirements</text>
  <!-- Arrow 1 -> 2 -->
  <path d="M 720 120 Q 755 190 735 240" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#cyc-arrow)"/>

  <!-- Quadrant 2: Bottom-Right (DO) -->
  <rect x="520" y="260" width="220" height="75" rx="8" fill="var(--sticky-g)" stroke="var(--green)" stroke-width="2"/>
  <text x="630" y="288" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--green)">2. DO (Execute Orders)</text>
  <text x="630" y="312" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Release shop orders, purchase,</text>
  <text x="630" y="327" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">and log real-time confirmations</text>
  <!-- Arrow 2 -> 3 -->
  <path d="M 640 340 Q 560 410 440 410" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#cyc-arrow)"/>

  <!-- Quadrant 3: Bottom-Left (CHECK) -->
  <rect x="120" y="260" width="220" height="75" rx="8" fill="var(--sticky-r)" stroke="var(--red)" stroke-width="2"/>
  <text x="230" y="288" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--red)">3. CHECK (Variance Analysis)</text>
  <text x="230" y="312" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Compare standard vs actual cost,</text>
  <text x="230" y="327" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">scrap rates, and schedule slippage</text>
  <!-- Arrow 3 -> 4 -->
  <path d="M 140 250 Q 110 180 145 130" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#cyc-arrow)"/>

  <!-- Quadrant 4: Top-Left (ACT) -->
  <rect x="120" y="40" width="220" height="75" rx="8" fill="var(--card)" stroke="var(--amber)" stroke-width="2"/>
  <text x="230" y="68" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--amber)">4. ACT (Calibrate & Tune)</text>
  <text x="230" y="92" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Adjust lead times, reorder points,</text>
  <text x="230" y="107" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">and supplier scorecards in master data</text>
  <!-- Arrow 4 -> 1 -->
  <path d="M 240 35 Q 350 -5 470 35" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#cyc-arrow)"/>
</svg>
