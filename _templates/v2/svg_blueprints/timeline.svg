<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="tl-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Horizontal Axis -->
  <path d="M 40 120 L 760 120" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" marker-end="url(#tl-arrow)"/>

  <!-- Milestone 1: 1960s ROP -->
  <circle cx="100" cy="120" r="14" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>
  <circle cx="100" cy="120" r="6" fill="var(--ink)"/>
  <text x="100" y="80" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">1960s</text>
  <text x="100" y="160" text-anchor="middle" font-family="var(--font-hand2)" font-size="15" font-weight="700" fill="var(--text)">Inventory ROP</text>
  <text x="100" y="180" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Reorder Point models</text>

  <!-- Milestone 2: 1970s MRP -->
  <circle cx="280" cy="120" r="14" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>
  <circle cx="280" cy="120" r="6" fill="var(--ink)"/>
  <text x="280" y="80" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">1970s</text>
  <text x="280" y="160" text-anchor="middle" font-family="var(--font-hand2)" font-size="15" font-weight="700" fill="var(--text)">Material Reqs (MRP)</text>
  <text x="280" y="180" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">BOM explosion logic</text>

  <!-- Milestone 3: 1980s MRP II -->
  <circle cx="460" cy="120" r="14" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>
  <circle cx="460" cy="120" r="6" fill="var(--ink)"/>
  <text x="460" y="80" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">1980s</text>
  <text x="460" y="160" text-anchor="middle" font-family="var(--font-hand2)" font-size="15" font-weight="700" fill="var(--text)">Mfg Resource (MRP II)</text>
  <text x="460" y="180" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Shop-floor closed loops</text>

  <!-- Milestone 4: 1990s+ ERP (Highlighted) -->
  <circle cx="660" cy="120" r="18" fill="var(--hl-yellow)" stroke="var(--red)" stroke-width="3"/>
  <circle cx="660" cy="120" r="7" fill="var(--red)"/>
  <text x="660" y="75" text-anchor="middle" font-family="var(--font-hand)" font-size="24" font-weight="700" fill="var(--red)">1990s & Beyond</text>
  <text x="660" y="160" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Enterprise ERP</text>
  <text x="660" y="180" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="600" fill="var(--text)">Single Global Database</text>
  <text x="660" y="200" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" fill="var(--green)">✓ Multi-Country Finance</text>
</svg>
