<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Step 1: Requisition -->
  <path d="M 20 40 Q 95 38 170 40 Q 172 110 170 180 Q 95 182 20 180 Q 18 110 20 40 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/>
  <text x="95" y="65" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--pencil)">STEP 01</text>
  <text x="95" y="95" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Purchase Requisition</text>
  <text x="95" y="125" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">User demand initiated;</text>
  <text x="95" y="145" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">budget check cleared</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 170 110 Q 195 108 218 110" fill="none" stroke="var(--ink)" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Step 2: Purchase Order -->
  <path d="M 220 40 Q 295 38 370 40 Q 372 110 370 180 Q 295 182 220 180 Q 218 110 220 40 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/>
  <text x="295" y="65" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--pencil)">STEP 02</text>
  <text x="295" y="95" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Purchase Order (PO)</text>
  <text x="295" y="125" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Vendor selected;</text>
  <text x="295" y="145" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">legally binding PO sent</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 370 110 Q 395 108 418 110" fill="none" stroke="var(--ink)" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Step 3: Goods Receipt -->
  <path d="M 420 40 Q 495 38 570 40 Q 572 110 570 180 Q 495 182 420 180 Q 418 110 420 40 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/>
  <text x="495" y="65" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--pencil)">STEP 03</text>
  <text x="495" y="95" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Goods Receipt (GR)</text>
  <text x="495" y="125" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">Physical inspection;</text>
  <text x="495" y="145" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--text)">inventory increments</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 570 110 Q 595 108 618 110" fill="none" stroke="var(--ink)" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Step 4: Invoice Match (Highlighted Gate) -->
  <path d="M 620 40 Q 710 38 800 40 Q 802 110 800 180 Q 710 182 620 180 Q 618 110 620 40 Z" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="2.6"/>
  <text x="710" y="65" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--red)">CRITICAL GATE</text>
  <text x="710" y="95" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">3-Way Matching</text>
  <text x="710" y="125" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="600" fill="var(--text)">PO vs GR vs Vendor Bill</text>
  <text x="710" y="150" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" fill="var(--green)">✓ Automated Payment Release</text>
</svg>
