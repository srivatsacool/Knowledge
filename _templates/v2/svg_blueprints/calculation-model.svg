<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="calc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Y-Axis: Annual Cost ($) -->
  <path d="M 100 380 L 100 40" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#calc-arrow)"/>
  <text x="85" y="35" text-anchor="middle" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Annual Cost ($) ↑</text>

  <!-- X-Axis: Order Quantity (Q) -->
  <path d="M 90 370 L 800 370" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#calc-arrow)"/>
  <text x="790" y="395" text-anchor="end" font-family="var(--font-hand)" font-size="19" font-weight="700" fill="var(--ink)">Order Quantity (Q) →</text>

  <!-- Holding Cost Curve (Linear Rising) -->
  <path d="M 100 370 L 740 90" stroke="var(--green)" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="95" font-family="var(--font-hand)" font-size="18" font-weight="700" fill="var(--green)">Annual Holding Cost: (Q/2)·H</text>

  <!-- Ordering Cost Curve (Hyperbolic Falling) -->
  <path d="M 120 70 Q 200 280 740 355" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="350" font-family="var(--font-hand)" font-size="18" font-weight="700" fill="var(--red)">Annual Setup Cost: (D/Q)·S</text>

  <!-- Total Cost Curve (U-Shaped Sum) -->
  <path d="M 140 60 Q 380 340 730 110" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="740" y="125" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">Total Cost TC(Q)</text>

  <!-- Optimal Point Q* (Minimum Point of Total Cost) -->
  <!-- Intersection of Holding and Ordering is at X=380, Y=225 approx -->
  <line x1="380" y1="370" x2="380" y2="185" stroke="var(--pencil)" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="100" y1="185" x2="380" y2="185" stroke="var(--pencil)" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- Minimum Dot -->
  <circle cx="380" cy="185" r="7" fill="var(--amber)" stroke="var(--ink)" stroke-width="2.5"/>

  <!-- Optimal Q* Label on X-Axis -->
  <rect x="345" y="375" width="70" height="28" rx="4" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="380" y="394" text-anchor="middle" font-family="var(--font-hand)" font-size="18" font-weight="700" fill="var(--ink)">Q* (EOQ)</text>

  <!-- Minimum Cost TC* Label on Y-Axis -->
  <rect x="25" y="170" width="70" height="28" rx="4" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="60" y="190" text-anchor="middle" font-family="var(--font-hand)" font-size="17" font-weight="700" fill="var(--ink)">TC(min)</text>

  <!-- Sticky Note Annotation on Chart -->
  <rect x="420" y="175" width="220" height="70" rx="6" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="530" y="200" text-anchor="middle" font-family="var(--font-hand2)" font-size="13" font-weight="700" fill="var(--red)">ECONOMIC EQUILIBRIUM</text>
  <text x="530" y="222" text-anchor="middle" font-family="var(--font-hand)" font-size="17" font-weight="700" fill="var(--ink)">At Q*, Holding Cost = Setup Cost</text>
  <text x="530" y="238" text-anchor="middle" font-family="var(--font-math)" font-size="14" fill="var(--pencil)">Q* = √( (2·D·S) / H )</text>
</svg>
