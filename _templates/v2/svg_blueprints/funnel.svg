<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="fn-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Funnel Top Stage (Wide) -->
  <path d="M 120 40 L 740 40 L 660 130 L 200 130 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="430" y="75" text-anchor="middle" font-family="var(--font-hand)" font-size="22" font-weight="700" fill="var(--ink)">STAGE 1: Demand & Raw Requirements (100%)</text>
  <text x="430" y="105" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--pencil)">Unfiltered customer requests, stakeholder wishlists, and raw backlog</text>

  <!-- Leakage Callout 1 (Right) -->
  <path d="M 680 85 Q 730 85 770 100" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#fn-arrow)"/>
  <text x="775" y="118" font-family="var(--font-hand2)" font-size="13" fill="var(--red)">-40% Scope Pruning</text>

  <!-- Funnel Mid Stage (Medium) -->
  <path d="M 210 145 L 650 145 L 570 235 L 290 235 Z" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="430" y="180" text-anchor="middle" font-family="var(--font-hand)" font-size="21" font-weight="700" fill="var(--ink)">STAGE 2: Prioritization & Feasibility (60%)</text>
  <text x="430" y="210" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--text)">Value Matrix scoring, capacity checks, and standard fit evaluation</text>

  <!-- Leakage Callout 2 (Right) -->
  <path d="M 590 190 Q 640 190 710 205" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#fn-arrow)"/>
  <text x="715" y="222" font-family="var(--font-hand2)" font-size="13" fill="var(--red)">-35% Budget / Capacity Cap</text>

  <!-- Funnel Bottom Stage (Narrow) -->
  <path d="M 300 250 L 560 250 L 490 340 L 370 340 Z" fill="var(--sticky-g)" stroke="var(--green)" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="430" y="285" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--green)">STAGE 3: Execution (25%)</text>
  <text x="430" y="315" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="600" fill="var(--text)">High-ROI Committed Production Orders</text>

  <!-- Output Arrow Downwards -->
  <path d="M 430 342 L 430 365" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fn-arrow)"/>
  <text x="510" y="365" font-family="var(--font-hand2)" font-size="14" font-weight="700" fill="var(--green)">MAXIMUM MARGIN YIELD</text>
</svg>
