<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <!-- Table Header -->
  <path d="M 40 30 Q 430 26 820 30 Q 822 65 820 80 Q 430 84 40 80 Q 38 65 40 30 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.4"/>
  <text x="180" y="60" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">EVALUATION DIMENSION</text>
  <text x="440" y="60" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--ink)">LEGACY ON-PREM</text>
  <text x="700" y="60" text-anchor="middle" font-family="var(--font-hand)" font-size="20" font-weight="700" fill="var(--green)">MODERN CLOUD SAAS ⭐</text>

  <!-- Row 1: Implementation Speed -->
  <rect x="40" y="85" width="780" height="65" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="60" y="122" font-family="var(--font-hand2)" font-size="16" font-weight="700" fill="var(--text)">Time to Go-Live</text>
  <text x="440" y="115" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--red)">18 – 36 Months ❌</text>
  <text x="440" y="135" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">High infrastructure delay</text>
  <text x="700" y="115" text-anchor="middle" font-family="var(--font-body)" font-size="13" font-weight="600" fill="var(--green)">4 – 9 Months ✓</text>
  <text x="700" y="135" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Pre-configured templates</text>

  <!-- Row 2: Capital vs Operating Cost -->
  <rect x="40" y="155" width="780" height="65" fill="var(--sticky-y)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="60" y="192" font-family="var(--font-hand2)" font-size="16" font-weight="700" fill="var(--text)">CapEx vs OpEx Profile</text>
  <text x="440" y="185" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--red)">Heavy Upfront CapEx</text>
  <text x="440" y="205" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Servers + Perpetual Licenses</text>
  <text x="700" y="185" text-anchor="middle" font-family="var(--font-body)" font-size="13" font-weight="600" fill="var(--green)">Predictable OpEx Subscriptions</text>
  <text x="700" y="205" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Zero hardware amortization</text>

  <!-- Row 3: Customization & Technical Debt -->
  <rect x="40" y="225" width="780" height="65" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="60" y="262" font-family="var(--font-hand2)" font-size="16" font-weight="700" fill="var(--text)">Customization & Upgrades</text>
  <text x="440" y="255" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--red)">"Version Lock" Trap ⚠️</text>
  <text x="440" y="275" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Custom code breaks upgrades</text>
  <text x="700" y="255" text-anchor="middle" font-family="var(--font-body)" font-size="13" font-weight="600" fill="var(--green)">Clean Core via APIs ✓</text>
  <text x="700" y="275" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Continuous bi-annual updates</text>

  <!-- Row 4: Security & Disaster Recovery -->
  <rect x="40" y="295" width="780" height="65" fill="var(--sticky-g)" stroke="var(--green)" stroke-width="1.5"/>
  <text x="60" y="332" font-family="var(--font-hand2)" font-size="16" font-weight="700" fill="var(--text)">Cybersecurity & DR</text>
  <text x="440" y="325" text-anchor="middle" font-family="var(--font-body)" font-size="13" fill="var(--pencil)">Internal IT dependent</text>
  <text x="440" y="345" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Patch fatigue & single point of failure</text>
  <text x="700" y="325" text-anchor="middle" font-family="var(--font-body)" font-size="13" font-weight="600" fill="var(--green)">Hyperscale SOC 2 Type II</text>
  <text x="700" y="345" text-anchor="middle" font-family="var(--font-body)" font-size="11" fill="var(--pencil)">Geo-replicated zero-loss failover</text>

  <!-- Bottom Annotation -->
  <text x="430" y="385" text-anchor="middle" font-family="var(--font-hand)" font-size="16" font-weight="700" fill="var(--ink)">
    Strategic Takeaway: Multi-tenant SaaS delivers 40% lower 5-year TCO when vanilla standards are enforced.
  </text>
</svg>
